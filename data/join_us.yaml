title: "Join Us"
intro: "Explore research opportunities in corn entomology, Bt resistance, and sustainable pest management."
inquiries:
  - id: "graduate-students"
    title: "Graduate Students"
    description: |
      Research in our lab spans the mechanisms underlying resistance evolution, insect biology and ecology, and pest monitoring and management in corn production systems. Students with backgrounds in entomology, ecology, biology, agriculture, bioinformatics, or related disciplines are encouraged to get in touch. Students in our lab have opportunities to attend academic conferences, actively participate in extension and outreach activities, and connect with industry professionals.

      If you are interested in joining our lab, please contact Dr. Fei Yang directly with your CV and a cover letter describing your research interests, relevant experience, and why you would like to join us. Please also indicate your intended degree and preferred starting semester, and use “Corn Entomology Yang Lab graduate/undergraduate student application” as the email subject.
    subject: "Corn Entomology Yang Lab graduate/undergraduate student application"
  - id: "undergraduates"
    title: "Undergraduates"
    description: "Undergraduates interested in gaining experience in insect research are welcome to contact Dr.Yang about potential laboratory and field opportunities. Please briefly describe your major, research interests, and availability."
    subject: "Undergraduate Research Inquiry"
