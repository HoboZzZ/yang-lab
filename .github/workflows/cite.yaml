name: Update citations

on:
  workflow_dispatch:
  schedule:
    - cron: "0 14 * * 1"

permissions:
  contents: write

jobs:
  cite:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build citations from ORCID and DOI sources
        run: python scripts/cite.py
      - name: Commit updated citations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/citations.json
          if git diff --staged --quiet; then
            echo "No citation changes."
            exit 0
          fi
          git commit -m "Update citations from ORCID"
          git push
