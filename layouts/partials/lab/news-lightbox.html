<dialog class="news-lightbox" aria-labelledby="news-lightbox-title">
  <div class="news-lightbox-top">
    <h2 id="news-lightbox-title" class="visually-hidden">News photo viewer</h2>
    <span class="news-lightbox-count" aria-live="polite" aria-atomic="true"></span>
    <button type="button" class="news-lightbox-close" aria-label="Close photo viewer" autofocus>Close <span aria-hidden="true">×</span></button>
  </div>
  <figure class="news-lightbox-figure">
    <img alt="" width="1600" height="1200">
    <figcaption class="news-lightbox-caption" aria-live="polite" aria-atomic="true"></figcaption>
  </figure>
  <div class="news-lightbox-controls">
    <button type="button" class="news-lightbox-prev" aria-label="Previous photo">← Previous</button>
    <button type="button" class="news-lightbox-next" aria-label="Next photo">Next →</button>
  </div>
</dialog>
